<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5B2038"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="/static/icon-192.png"><link rel="stylesheet" href="/static/style.css"><title>تسجيل الدخول | SARA Downloader</title></head>
<body class="login-body"><div class="background-orb orb-one"></div><div class="background-orb orb-two"></div><main class="login-shell"><div class="login-brand"><span class="brand-logo login-logo">S<span class="logo-spark">✦</span></span><div class="eyebrow">PERSONAL · PRIVATE · SECURE</div><h1>مساحتك الخاصة <span>للتحميل.</span></h1><p>أدخل كلمة المرور الخاصة بك للمتابعة إلى SARA Downloader.</p></div><div class="panel login-panel"><h2>تسجيل الدخول</h2><p>كلمة المرور موجودة في ملف <code>.env</code>، وتظهر عند تشغيل التطبيق لأول مرة.</p><form action="/login" method="post"><label for="password">كلمة المرور</label><input type="password" id="password" name="password" placeholder="••••••••••••" required autofocus autocomplete="current-password"><button class="primary" type="submit">الدخول للتطبيق <span aria-hidden="true">↗</span></button></form><p class="form-error" id="loginError" hidden>كلمة المرور غير صحيحة.</p><p class="login-footnote">التطبيق يعمل على الكمبيوتر ويمكن فتحه من الآيفون على نفس الشبكة.</p></div></main><script src="/static/login.js" defer></script></body></html>
